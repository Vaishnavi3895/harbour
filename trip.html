<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Brainstorming + The Plan</title>
<style>

:root{
  --bg-1:       #FBF4F2;
  --bg-2:       #F1E6EC;
  --card:       #FFFFFF;
  --card-tint:  #F6EFEC;
  --ink:        #2C3A45;
  --ink-soft:   #5C6B75;
  --ink-muted:  #8B98A0;
  --blue:       #6FA9C4;
  --blue-bg:    #DCEBF2;
  --blue-text:  #2E6C88;
  --pink:       #EFAFC2;
  --pink-bg:    #FBE3EA;
  --pink-text:  #B2436A;
  --mint:       #8FC2A9;
  --mint-bg:    #E5F2EB;
  --mint-text:  #3B6D48;
  --amber-bg:   #FCEFD8;
  --amber-text: #8A6423;
  --danger:     #D45C6B;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  font-family:var(--font-sans); color:var(--ink);
  background:linear-gradient(180deg, var(--bg-1), var(--bg-2));
  min-height:100vh; padding:20px 16px 40px;
}
button{ font-family:inherit; }
.wrap{ max-width:420px; margin:0 auto; }

.top-tabs{ display:flex; gap:8px; margin-bottom:16px; background:var(--card-tint); border-radius:14px; padding:5px; }
.top-tab{ flex:1; padding:9px 0; border-radius:10px; border:none; background:none; font-size:12.5px; font-weight:500; color:var(--ink-soft); cursor:pointer; }
.top-tab.active{ background:var(--card); color:var(--ink); box-shadow:0 2px 6px rgba(44,58,69,0.08); }

.tab-header{ margin-bottom:12px; }
.tab-header h1{ font-size:16px; font-weight:600; }
.tab-header p{ font-size:11px; color:var(--ink-muted); }

.view{ display:none; }
.view.active{ display:block; }

.panel{ background:var(--card-tint); border-radius:20px; padding:12px; margin-bottom:16px; }

.chat-pane{ background:var(--card); border-radius:16px; padding:14px; max-height:320px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
.msg{ display:flex; gap:8px; align-items:flex-start; }
.msg.mine{ flex-direction:row-reverse; }
.avatar{ width:26px; height:26px; border-radius:50%; flex:0 0 26px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:600; color:#fff; }
.msg-body{ max-width:78%; }
.msg-sender-row{ display:flex; align-items:center; gap:6px; margin-bottom:3px; }
.msg-sender{ font-size:10px; color:var(--ink-muted); }
.msg.mine .msg-sender-row{ flex-direction:row-reverse; }
.msg-menu-btn{ width:16px; height:16px; cursor:pointer; color:var(--ink-muted); flex:0 0 auto; }
.msg-menu-btn:hover{ color:var(--ink); }
.msg-menu{ background:var(--card); border:1px solid #E9E1DA; border-radius:10px; padding:4px; margin-top:4px; box-shadow:0 4px 10px rgba(44,58,69,0.1); }
.msg-menu button{ display:block; width:100%; text-align:left; padding:7px 10px; border:none; background:none; font-size:11px; color:var(--ink); cursor:pointer; border-radius:6px; }
.msg-menu button:hover{ background:var(--card-tint); }
.msg-menu button.danger{ color:var(--danger); }
.msg-menu button:disabled{ color:var(--ink-muted); cursor:default; }
.msg-menu button:disabled:hover{ background:none; }
.unsent-bubble{ font-size:11.5px; font-style:italic; color:var(--ink-muted); padding:8px 10px; }
.reply-quote{ background:var(--card-tint); border-left:2.5px solid var(--blue); border-radius:6px; padding:5px 8px; margin-bottom:5px; font-size:10px; color:var(--ink-soft); }
.reply-quote b{ color:var(--ink); }
.reply-preview-bar{ display:flex; align-items:center; justify-content:space-between; background:var(--card); border-radius:10px; padding:7px 10px; margin-top:8px; border-left:2.5px solid var(--blue); }
.reply-preview-bar span{ font-size:11px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.reply-preview-bar svg{ width:14px; height:14px; color:var(--ink-muted); cursor:pointer; flex:0 0 auto; }
.bubble{ background:var(--card-tint); border-radius:12px; padding:8px 10px; font-size:12.5px; }
.msg.mine .bubble{ background:var(--blue-bg); color:var(--blue-text); }

.link-card{ background:var(--card-tint); border-radius:12px; padding:9px 10px; display:flex; align-items:center; gap:9px; width:220px; cursor:pointer; }
.link-icon{ width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex:0 0 32px; }
.link-icon svg{ width:15px; height:15px; color:#fff; }
.link-info{ flex:1; min-width:0; }
.link-domain{ font-size:11px; font-weight:600; }
.link-url{ font-size:9.5px; color:var(--ink-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.link-shortlist-btn{ font-size:9px; padding:4px 8px; border:none; border-radius:7px; background:var(--blue); color:#fff; cursor:pointer; flex:0 0 auto; }
.link-shortlist-btn.added{ background:var(--mint); }

.poll-card{ background:var(--card-tint); border-radius:12px; padding:10px; width:220px; }
.poll-q{ font-size:11.5px; font-weight:600; margin-bottom:8px; }
.poll-opt{ position:relative; background:var(--card); border-radius:8px; padding:6px 9px; margin-bottom:5px; cursor:pointer; overflow:hidden; }
.poll-opt:last-child{ margin-bottom:0; }
.poll-fill{ position:absolute; left:0; top:0; bottom:0; background:var(--blue-bg); z-index:0; transition:width 0.3s ease; }
.poll-row{ position:relative; z-index:1; display:flex; justify-content:space-between; font-size:10.5px; }
.poll-opt.voted{ outline:1.5px solid var(--blue); }
.poll-shortlist-btn{ margin-top:8px; width:100%; font-size:9.5px; padding:6px 0; border:none; border-radius:7px; background:var(--blue); color:#fff; cursor:pointer; }
.poll-shortlist-btn.added{ background:var(--mint); }

.place-card{ background:var(--card-tint); border-radius:12px; padding:8px 10px; display:flex; align-items:center; gap:8px; width:fit-content; cursor:pointer; }
.place-icon{ width:30px; height:30px; border-radius:8px; background:var(--blue-bg); display:flex; align-items:center; justify-content:center; flex:0 0 30px; }
.place-icon svg{ width:14px; height:14px; color:var(--blue-text); }

.adhoc-card{ background:var(--card-tint); border-radius:12px; padding:10px; width:220px; }
.adhoc-card.formed{ background:var(--mint-bg); }
.adhoc-title{ font-size:11.5px; margin-bottom:4px; }
.adhoc-when{ font-size:9.5px; color:var(--ink-muted); margin-bottom:8px; }
.adhoc-row{ display:flex; align-items:center; justify-content:space-between; }
.opt-in-btn{ font-size:10px; padding:6px 12px; border:1px solid var(--blue); background:none; color:var(--blue-text); border-radius:8px; cursor:pointer; }
.opt-in-btn.joined{ background:var(--blue); color:#fff; }
.opt-in-count{ font-size:10px; color:var(--ink-muted); }
.formed-tag{ font-size:10px; background:var(--mint); color:#fff; padding:3px 9px; border-radius:8px; display:inline-flex; align-items:center; gap:4px; }

.input-row{ display:flex; align-items:center; gap:8px; margin-top:12px; }
.input-row input{ flex:1; padding:9px 12px; border:1px solid #E9E1DA; border-radius:20px; font-size:16px; font-family:inherit; }
.icon-btn{ width:34px; height:34px; border-radius:50%; border:none; background:var(--card); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto; }
.icon-btn svg{ width:16px; height:16px; color:var(--ink-soft); }
.icon-btn.send{ background:var(--blue); }
.icon-btn.send svg{ color:#fff; }

.quick-actions{ display:flex; gap:6px; margin-top:8px; }
.quick-actions button{ flex:1; font-size:10px; padding:7px 0; border-radius:10px; border:1px solid #E9E1DA; background:var(--card); color:var(--ink-soft); cursor:pointer; }

.shortlist-section{ margin-top:16px; }
.section-title{ font-size:12px; font-weight:600; margin:0 0 8px 4px; color:var(--ink-soft); }
.shortlist-pane{ background:var(--card); border-radius:16px; padding:10px; max-height:220px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
.shortlist-item{ display:flex; align-items:center; gap:9px; background:var(--card-tint); border-radius:10px; padding:8px; }
.shortlist-item p{ font-size:11.5px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.shortlist-item p.placed{ color:var(--ink-muted); text-decoration:line-through; }
.add-to-plan-btn{ font-size:9.5px; padding:5px 10px; border:none; border-radius:7px; background:var(--ink); color:#fff; cursor:pointer; flex:0 0 auto; }
.add-to-plan-btn.done{ background:var(--mint); }
.shortlist-empty{ font-size:11px; color:var(--ink-muted); text-align:center; padding:14px 0; }

.ai-suggest-card{ background:var(--card-tint); border-radius:12px; padding:10px; max-width:220px; }
.ai-suggest-card p.place{ font-size:12px; font-weight:600; margin-bottom:2px; }
.ai-suggest-card p.why{ font-size:10.5px; color:var(--ink-soft); margin-bottom:8px; }
.ai-suggest-btn{ font-size:10px; padding:6px 10px; border:none; border-radius:7px; background:var(--blue); color:#fff; cursor:pointer; }
.ai-suggest-btn.added{ background:var(--mint); }
.ai-propose-card{ background:#FCEFD8; border-radius:12px; padding:10px 12px; max-width:230px; }
.ai-propose-card p.title{ font-size:11.5px; font-weight:600; color:#8A6423; margin-bottom:6px; }
.ai-propose-card p.detail{ font-size:11px; color:#8A6423; margin-bottom:8px; }
.ai-propose-actions{ display:flex; gap:6px; }
.ai-propose-actions button{ flex:1; font-size:10px; padding:6px 0; border-radius:7px; border:none; cursor:pointer; }
.ai-confirm-btn{ background:var(--ink); color:#fff; }
.ai-decline-btn{ background:none; border:1px solid #D9C29A !important; color:#8A6423; }
.ai-confirmed-tag{ font-size:10px; background:var(--mint); color:#fff; padding:3px 9px; border-radius:7px; display:inline-block; }

.day-tabs{ display:flex; gap:6px; overflow-x:auto; margin-bottom:12px; padding-bottom:2px; }
.day-chip{ flex:0 0 auto; padding:7px 14px; border-radius:10px; background:var(--card); border:1px solid #E9E1DA; font-size:11px; color:var(--ink-soft); cursor:pointer; }
.day-chip.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
.add-day-chip{ flex:0 0 auto; padding:7px 12px; border-radius:10px; background:none; border:1px dashed var(--ink-muted); font-size:11px; color:var(--ink-muted); cursor:pointer; }

.entry-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
.entry-row{ display:flex; align-items:flex-start; gap:10px; }
.entry-time{ flex:0 0 46px; font-size:10.5px; color:var(--ink-muted); text-align:right; padding-top:11px; }
.entry-card{ flex:1; background:var(--card); border-radius:12px; padding:10px 12px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
.entry-card.adhoc{ border:1px dashed var(--blue); }
.entry-name{ font-size:12.5px; }
.entry-meta{ display:flex; align-items:center; gap:6px; margin-top:3px; }
.entry-source{ font-size:9px; color:var(--ink-muted); font-style:italic; }
.attendee-tag{ font-size:9.5px; padding:2px 7px; border-radius:7px; }
.attendee-everyone{ background:var(--blue-bg); color:var(--blue-text); }
.attendee-some{ background:var(--pink-bg); color:var(--pink-text); }
.entry-actions svg{ width:14px; height:14px; color:var(--ink-muted); cursor:pointer; }
.entry-actions svg:hover{ color:var(--ink); }
.add-entry-btn{ width:100%; padding:9px 0; border-radius:10px; border:1px dashed #C9BEB4; background:none; color:var(--ink-soft); font-size:11.5px; cursor:pointer; }

.modal-overlay{ position:fixed; inset:0; background:rgba(44,58,69,0.4); z-index:100; display:none; align-items:center; justify-content:center; padding:20px; }
.modal-overlay.open{ display:flex; }
.modal{ background:var(--bg-1); width:100%; max-width:320px; border-radius:16px; padding:20px; max-height:85vh; overflow-y:auto; }
.modal h3{ font-size:14px; margin-bottom:12px; }
.modal input{ width:100%; padding:9px 10px; border:1px solid #E9E1DA; border-radius:8px; font-size:16px; margin-bottom:8px; font-family:inherit; }
.modal label{ font-size:10.5px; color:var(--ink-soft); display:block; margin-bottom:6px; }
.field-row{ display:flex; gap:8px; }
.field-row > div{ flex:1; }
.attendee-picker{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
.attendee-chip{ padding:6px 11px; border-radius:9px; border:1px solid #E9E1DA; background:var(--card); font-size:11px; cursor:pointer; color:var(--ink-soft); }
.attendee-chip.selected{ background:var(--blue); color:#fff; border-color:var(--blue); }
.modal-actions{ display:flex; gap:8px; margin-top:6px; }
.modal-actions button{ flex:1; padding:9px 0; border-radius:8px; cursor:pointer; font-size:12px; border:none; }
.btn-primary{ background:var(--ink); color:#fff; }
.btn-cancel{ background:none; border:1px solid #E9E1DA !important; color:var(--ink-soft); }
.btn-danger{ background:var(--danger); color:#fff; }
select{ width:100%; padding:9px 10px; border:1px solid #E9E1DA; border-radius:8px; font-size:16px; margin-bottom:8px; font-family:inherit; }


</style>
</head>
<body>



<div class="wrap">
  <!-- Trigger lives here, OUTSIDE all three switching views on purpose —
       this page has three separate .tab-header elements (one per internal
       view), so moving the trigger into any single one of them would hide
       it whenever a different view becomes active. This bar is always
       visible regardless of which internal view is showing. -->
  
  <!-- No visible internal toggle here on purpose — the shell's own tab bar
       (Brainstorm / AI Chat / The Plan) already does this navigation.
       A second toggle here would just be the same choice shown twice. -->

  <div class="view active" id="view-brainstorm">
    <div class="tab-header"><h1>Brainstorming</h1><p>Bali, 4–8 Aug</p></div>

    <div class="panel">
      <div class="chat-pane" id="chatPane"></div>
      <div class="reply-preview-bar" id="replyPreviewBar" style="display:none;">
        <span id="replyPreviewText"></span>
        <svg id="cancelReplyBtn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </div>
      <div class="input-row">
        <input type="text" id="msgInput" placeholder="Message the group">
        <button class="icon-btn send" id="sendBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
      </div>
      <div class="quick-actions">
        <button id="pollBtn">+ Poll</button>
        <button id="linkBtn">+ Share a link</button>
        <button id="ideaBtn">+ Suggest a plan</button>
      </div>
    </div>

    <div class="shortlist-section">
      <p class="section-title">Shortlist — the bridge to The Plan</p>
      <div class="shortlist-pane" id="shortlistPane"></div>
    </div>
  </div>

  <div class="view" id="view-ai-chat">
    <div class="tab-header"><h1>Trip assistant</h1><p>Bali, 4–8 Aug</p></div>
    <div class="panel">
      <div class="chat-pane" id="aiChatPane"></div>
      <div class="input-row">
        <input type="text" id="aiMsgInput" placeholder="Ask the assistant...">
        <button class="icon-btn send" id="aiSendBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
      </div>
    </div>
    <div class="shortlist-section">
      <p class="section-title">Shortlist — same list as Brainstorming</p>
      <div class="shortlist-pane" id="shortlistPaneAI"></div>
    </div>
  </div>

  <div class="view" id="view-plan">
    <div class="tab-header"><h1>The Plan</h1><p>Bali, 4–8 Aug</p></div>

    <div class="panel">
      <div class="day-tabs" id="dayTabs"></div>
      <div class="entry-list" id="entryList"></div>
      <button class="add-entry-btn" id="addEntryBtn">+ Add to this day</button>
    </div>
  </div>
</div>


<div class="modal-overlay" id="pollModal">
  <div class="modal">
    <h3>New poll</h3>
    <input type="text" id="pollQ" placeholder="Question">
    <div id="pollOptionsContainer">
      <input type="text" class="poll-option-input" placeholder="Option 1">
      <input type="text" class="poll-option-input" placeholder="Option 2">
    </div>
    <button type="button" id="addPollOption" style="background:none;border:none;color:var(--blue-text);font-size:11px;cursor:pointer;padding:4px 0 10px;text-align:left;">+ Add more options</button>
    <div class="modal-actions">
      <button class="btn-cancel" data-close="pollModal">Cancel</button>
      <button class="btn-primary" id="pollSave">Create poll</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="linkModal">
  <div class="modal">
    <h3>Share a link</h3>
    <input type="text" id="linkUrl" placeholder="Paste an Instagram, YouTube, maps, or blog link">
    <div class="modal-actions">
      <button class="btn-cancel" data-close="linkModal">Cancel</button>
      <button class="btn-primary" id="linkSave">Share</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="ideaModal">
  <div class="modal">
    <h3>Suggest a plan</h3>
    <input type="text" id="ideaText" placeholder="e.g. Sunrise hike">
    <label>When — needed so the app knows which day this belongs to</label>
    <div class="field-row">
      <div><input type="text" id="ideaDay" placeholder="Day (e.g. Day 3)"></div>
      <div><input type="time" id="ideaTime"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" data-close="ideaModal">Cancel</button>
      <button class="btn-primary" id="ideaSave">Post</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="entryModal">
  <div class="modal">
    <h3 id="entryModalTitle">Add to Day 1</h3>
    <input type="text" id="entryName" placeholder="Place or activity">
    <label>Which day</label>
    <select id="entryDay"></select>
    <input type="time" id="entryTime">
    <label>Who's going</label>
    <div class="attendee-picker" id="attendeePicker"></div>
    <div class="modal-actions">
      <button class="btn-danger" id="entryDelete" style="display:none;">Delete</button>
      <button class="btn-cancel" data-close="entryModal">Cancel</button>
      <button class="btn-primary" id="entrySave">Save</button>
    </div>
  </div>
</div>

<script>
const groupMembers = ['You','Ria','Sam','Arjun'];

// ---- Solo vs Group ----
const tripType = new URLSearchParams(window.location.search).get('tripType') || window.__PRESET_TRIP_TYPE || 'group';
const isSolo = tripType === 'solo';
const soloMembers = ['You'];
const activeMembers = isSolo ? soloMembers : groupMembers;

function applySoloMode(){
  if(!isSolo) return;
  // Chat, links, and the shortlist stay for solo — jotting down places and
  // links to move into your shortlist is still useful alone. Only poll and
  // "suggest a plan" go, since both depend on other people voting/opting in.
  document.getElementById('pollBtn').style.display = 'none';
  document.getElementById('ideaBtn').style.display = 'none';
  document.getElementById('msgInput').placeholder = 'Jot down your ideas';
}
const avatarColors = { Sam:'#6FA9C4', Ria:'#EFAFC2', Arjun:'#D9A441', You:'#8FC2A9' };
function initials(name){ return name[0]; }

let messages = [
  { type:'link', sender:'Sam', url:'https://youtube.com/watch?v=xyz', title:'Tibumana waterfall — 30 min hike, no entry fee', addedToShortlist:false },
  { type:'poll', sender:'Sam', question:'Which waterfall for day 3?', options:[
    { label:'Tibumana', votes:3 }, { label:'Tegenungan', votes:1 }
  ], voted:false, addedToShortlist:false },
  { type:'place', sender:'Arjun', title:'Beach club — we\'re here now', sub:'Tap to view on map',
    url:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('Beach club Bali') },
];

let shortlist = [];
let openMenuIdx = null;
let replyingTo = null; // { sender, preview } — a snapshot, not a live index, so it can't go stale if messages are deleted

function shortlistLabelFor(m){
  if(m.type === 'text') return m.text;
  if(m.type === 'link') return m.title || m.url;
  if(m.type === 'poll'){
    const winner = m.options.reduce((a,b)=> b.votes>a.votes?b:a, m.options[0]);
    return winner.label;
  }
  if(m.type === 'place') return m.title;
  if(m.type === 'adhoc') return m.text;
  return '';
}

let days = [
  { label:'Day 1', entries:[ { time:'09:00', name:'Airport pickup', attendees:['You','Ria','Sam','Arjun'] } ] },
  { label:'Day 2', entries:[ { time:'09:00', name:'Tegallalang rice terraces', attendees:['You','Ria','Sam','Arjun'] } ] },
  { label:'Day 3', entries:[] },
];
let activeDay = 1;
let editingEntry = null;

function showView(viewKey){
  document.querySelectorAll('.view').forEach(v=> v.classList.remove('active'));
  document.getElementById('view-'+viewKey).classList.add('active');
  if(viewKey === 'plan'){ renderDayTabs(); renderEntries(); }
  if(viewKey === 'ai-chat'){ renderAIChat(); renderShortlist(); }
}

const chatPane = document.getElementById('chatPane');
const shortlistPane = document.getElementById('shortlistPane');

function linkType(url){
  const u = url.toLowerCase();
  if(u.includes('youtube.com') || u.includes('youtu.be')) return { label:'YouTube', icon:'M8 5v14l11-7z', color:'#D9534F' };
  if(u.includes('instagram.com')) return { label:'Instagram', icon:'M12 2a5 5 0 100 10 5 5 0 000-10z', color:'#C13584' };
  if(u.includes('maps.google') || u.includes('maps.app.goo') || u.includes('goo.gl/maps')) return { label:'Maps', icon:'M12 21s-7-6.5-7-11a7 7 0 1114 0c0 4.5-7 11-7 11z', color:'#6FA9C4' };
  return { label:'Article', icon:'M4 4h16v16H4zM4 9h16M9 4v16', color:'#8FC2A9' };
}

function addToShortlist(label, sourceIdx){
  shortlist.push({ label, placed:false, sourceIdx });
  renderShortlist();
}

function renderChat(){
  chatPane.innerHTML = '';
  messages.forEach((m, idx)=>{
    const wrap = document.createElement('div');
    const mine = m.sender === 'You';
    wrap.className = 'msg' + (mine ? ' mine' : '');
    const avatar = '<div class="avatar" style="background:'+(avatarColors[m.sender]||'#8B98A0')+'">'+initials(m.sender)+'</div>';

    if(m.type === 'unsent'){
      wrap.innerHTML = avatar + '<div class="msg-body"><div class="unsent-bubble">'+m.sender+' unsent a message</div></div>';
      chatPane.appendChild(wrap);
      return;
    }

    let content = '';
    if(m.type === 'text'){
      content = '<div class="bubble">'+m.text+'</div>';
    }
    if(m.type === 'link'){
      const t = linkType(m.url);
      content = '<div class="link-card" data-open="'+idx+'">'+
          '<div class="link-icon" style="background:'+t.color+'"><svg viewBox="0 0 24 24" fill="currentColor"><path d="'+t.icon+'"/></svg></div>'+
          '<div class="link-info"><div class="link-domain">'+t.label+'</div><div class="link-url">'+(m.title||m.url)+'</div></div>'+
        '</div>';
    }
    if(m.type === 'poll'){
      const total = m.options.reduce((s,o)=>s+o.votes,0);
      content = '<div class="poll-card">'+
          '<div class="poll-q">'+m.question+'</div>'+
          m.options.map((o,oi)=>{
            const pct = total ? Math.round(o.votes/total*100) : 0;
            return '<div class="poll-opt '+(m.voted===oi?'voted':'')+'" data-poll="'+idx+'" data-opt="'+oi+'">'+
              '<div class="poll-fill" style="width:'+pct+'%"></div>'+
              '<div class="poll-row"><span>'+o.label+'</span><span>'+o.votes+' votes</span></div>'+
            '</div>';
          }).join('')+
        '</div>';
    }
    if(m.type === 'place'){
      content = '<div class="place-card" data-open="'+idx+'">'+
          '<div class="place-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-6.5-7-11a7 7 0 1114 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.4"/></svg></div>'+
          '<div><div style="font-size:11.5px;">'+m.title+'</div><div style="font-size:9.5px;color:var(--ink-muted);">'+m.sub+'</div></div>'+
        '</div>';
    }
    if(m.type === 'adhoc'){
      const count = m.optIns.length;
      content = '<div class="adhoc-card '+(m.formed?'formed':'')+'">'+
          '<div class="adhoc-title">'+m.text+'</div>'+
          '<div class="adhoc-when">'+m.day+' · '+m.time+'</div>'+
          (m.formed
            ? '<span class="formed-tag">✓ Added to '+m.day+' — '+m.optIns.join(', ')+'</span>'
            : '<div class="adhoc-row">'+
                '<button class="opt-in-btn '+(m.youJoined?'joined':'')+'" data-optin="'+idx+'">'+(m.youJoined?"You're in ✓":"I'm in")+'</button>'+
                '<span class="opt-in-count">'+count+' joined</span>'+
              '</div>'
          )+
        '</div>';
    }

    const alreadyShortlisted = shortlist.some(s => s.sourceIdx === idx);
    const menuOpen = openMenuIdx === idx;
    const menuHtml = menuOpen ? (
      '<div class="msg-menu">'+
        '<button data-action="reply" data-idx="'+idx+'">Reply</button>'+
        '<button data-action="shortlist" data-idx="'+idx+'" '+(alreadyShortlisted?'disabled':'')+'>'+(alreadyShortlisted?'Added to shortlist ✓':'Add to shortlist')+'</button>'+
        (mine ? '<button data-action="unsend" data-idx="'+idx+'" class="danger">Unsend</button>' : '')+
        '<button data-action="delete" data-idx="'+idx+'" class="danger">Delete</button>'+
      '</div>'
    ) : '';

    const replyQuoteHtml = m.replyTo ? (
      '<div class="reply-quote"><b>'+m.replyTo.sender+'</b> '+m.replyTo.preview+'</div>'
    ) : '';

    wrap.innerHTML = avatar +
      '<div class="msg-body">'+
        '<div class="msg-sender-row">'+
          '<span class="msg-sender">'+m.sender+'</span>'+
          '<svg class="msg-menu-btn" data-menu-toggle="'+idx+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>'+
        '</div>'+
        replyQuoteHtml +
        content +
        menuHtml +
      '</div>';
    chatPane.appendChild(wrap);
  });
  chatPane.scrollTop = chatPane.scrollHeight;
  wireChatEvents();
}

function wireChatEvents(){
  chatPane.querySelectorAll('[data-menu-toggle]').forEach(el=>{
    el.addEventListener('click', e=>{
      e.stopPropagation();
      const i = +el.dataset.menuToggle;
      openMenuIdx = (openMenuIdx === i) ? null : i;
      renderChat();
    });
  });
  chatPane.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', e=>{
      e.stopPropagation();
      const i = +el.dataset.idx;
      const action = el.dataset.action;
      const m = messages[i];
      if(action === 'reply'){
        replyingTo = { sender: m.sender, preview: shortlistLabelFor(m) };
        showReplyPreview();
      }
      if(action === 'shortlist'){
        if(shortlist.some(s => s.sourceIdx === i)) return;
        addToShortlist(shortlistLabelFor(m), i);
      }
      if(action === 'unsend'){
        messages[i] = { type:'unsent', sender:m.sender };
      }
      if(action === 'delete'){
        messages.splice(i, 1);
      }
      openMenuIdx = null;
      renderChat();
    });
  });
  chatPane.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const i = +el.dataset.open;
      const url = messages[i].url;
      if(!url) return;
      window.open(url.startsWith('http')?url:'https://'+url, '_blank', 'noopener');
    });
  });
  chatPane.querySelectorAll('[data-poll]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const i = +el.dataset.poll, oi = +el.dataset.opt;
      const m = messages[i];
      if(m.voted === oi) return;
      if(typeof m.voted === 'number') m.options[m.voted].votes--;
      m.options[oi].votes++;
      m.voted = oi;
      renderChat();
    });
  });
  chatPane.querySelectorAll('[data-optin]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const i = +el.dataset.optin;
      const m = messages[i];
      if(m.youJoined) return;
      m.youJoined = true;
      m.optIns.push('You');
      if(m.optIns.length >= 2 && !m.formed){
        m.formed = true;
        let targetDay = days.findIndex(d => d.label.toLowerCase() === m.day.toLowerCase());
        if(targetDay === -1){ days.push({ label:m.day, entries:[] }); targetDay = days.length-1; }
        days[targetDay].entries.push({ time:m.time, name:m.text, attendees:[...m.optIns], _adhoc:true });
      }
      renderChat();
    });
  });
}

function showReplyPreview(){
  const bar = document.getElementById('replyPreviewBar');
  if(replyingTo){
    bar.style.display = 'flex';
    document.getElementById('replyPreviewText').textContent = 'Replying to ' + replyingTo.sender + ': ' + replyingTo.preview;
  } else {
    bar.style.display = 'none';
  }
}
document.getElementById('cancelReplyBtn').addEventListener('click', ()=>{
  replyingTo = null;
  showReplyPreview();
});

function renderShortlist(){
  const panes = [shortlistPane, document.getElementById('shortlistPaneAI')].filter(Boolean);
  if(shortlist.length===0){
    panes.forEach(p=> p.innerHTML = '<p class="shortlist-empty">Shortlist something from chat to see it here</p>');
    return;
  }
  const html = shortlist.map((s,i)=>
    '<div class="shortlist-item">'+
      '<p class="'+(s.placed?'placed':'')+'">'+s.label+'</p>'+
      '<button class="add-to-plan-btn '+(s.placed?'done':'')+'" data-pushplan="'+i+'">'+(s.placed?'On The Plan ✓':'Add to Plan →')+'</button>'+
    '</div>'
  ).join('');
  panes.forEach(pane=>{
    pane.innerHTML = html;
    pane.querySelectorAll('[data-pushplan]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const i = +el.dataset.pushplan;
        if(shortlist[i].placed) return;
        openEntryModal(activeDay, null, shortlist[i].label, i);
      });
    });
  });
}

/* ============================================================
   AI CHAT — shares this same instance (and its shortlist array)
   with Brainstorming and The Plan, so anything the AI suggests can
   go straight into the same cumulative shortlist.
   ============================================================ */
const aiChatPane = document.getElementById('aiChatPane');
let aiMessages = [
  { from:'ai', text:"Hi! Ask me to suggest places, optimize a day, or restructure the plan (e.g. \"move day 2 to day 3\")." },
];
let aiSuggestCounter = 0;

function renderAIChat(){
  aiChatPane.innerHTML = aiMessages.map(m=>{
    if(m.type === 'suggest'){
      return '<div class="msg"><div class="avatar" style="background:linear-gradient(135deg,#6FA9C4,#EFAFC2);">AI</div>'+
        '<div class="ai-suggest-card"><p class="place">'+m.place+'</p><p class="why">'+m.why+'</p>'+
        '<button class="ai-suggest-btn '+(m.added?'added':'')+'" data-aisuggest="'+m.id+'">'+(m.added?'Added to shortlist ✓':'Add to shortlist')+'</button>'+
        '</div></div>';
    }
    if(m.type === 'propose'){
      return '<div class="msg"><div class="avatar" style="background:linear-gradient(135deg,#6FA9C4,#EFAFC2);">AI</div>'+
        '<div class="ai-propose-card"><p class="title">Here\'s what I\'d change:</p><p class="detail">'+m.detail+'</p>'+
        (m.confirmed
          ? '<span class="ai-confirmed-tag">Confirmed ✓ — updated on The Plan</span>'
          : '<div class="ai-propose-actions"><button class="ai-confirm-btn" data-aiconfirm="'+m.id+'">Confirm</button><button class="ai-decline-btn" data-aidecline="'+m.id+'">Cancel</button></div>'
        )+
        '</div></div>';
    }
    const mine = m.from === 'You';
    return '<div class="msg'+(mine?' mine':'')+'">'+
      '<div class="avatar" style="background:'+(mine?'#8FC2A9':'linear-gradient(135deg,#6FA9C4,#EFAFC2)')+';">'+(mine?'Y':'AI')+'</div>'+
      '<div class="bubble">'+m.text+'</div></div>';
  }).join('');
  aiChatPane.scrollTop = aiChatPane.scrollHeight;

  aiChatPane.querySelectorAll('[data-aisuggest]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const m = aiMessages.find(x=>x.id===el.dataset.aisuggest);
      if(m.added) return;
      m.added = true;
      addToShortlist(m.place);
      renderAIChat();
    });
  });
  aiChatPane.querySelectorAll('[data-aiconfirm]').forEach(el=>{
    el.addEventListener('click', ()=>{
      aiMessages.find(x=>x.id===el.dataset.aiconfirm).confirmed = true;
      renderAIChat();
    });
  });
  aiChatPane.querySelectorAll('[data-aidecline]').forEach(el=>{
    el.addEventListener('click', ()=>{
      aiMessages = aiMessages.filter(x=>x.id!==el.dataset.aidecline);
      aiMessages.push({ from:'ai', text:'No worries — plan stays as is.' });
      renderAIChat();
    });
  });
}

function sendAIMessage(){
  const input = document.getElementById('aiMsgInput');
  const val = input.value.trim();
  if(!val) return;
  aiMessages.push({ from:'You', text:val });
  input.value = '';
  renderAIChat();

  setTimeout(()=>{
    if(/rain|move|day.*\d|restructure/i.test(val)){
      aiMessages.push({ type:'propose', id:'p'+(aiSuggestCounter++),
        detail:'Day 2 → moves to Day 3. Day 2 becomes open for the group to fill in Brainstorming.' });
    } else if(/suggest|recommend|place|spot|where/i.test(val)){
      aiMessages.push({ type:'suggest', id:'s'+(aiSuggestCounter++),
        place:'Tibumana waterfall', why:'30 min hike in, quiet before 9am, no entry fee', added:false });
    } else {
      aiMessages.push({ from:'ai', text:"Got it — try asking me to suggest a place, or restructure a day if plans change." });
    }
    renderAIChat();
  }, 500);
}
document.getElementById('aiSendBtn').addEventListener('click', sendAIMessage);
document.getElementById('aiMsgInput').addEventListener('keydown', e=>{ if(e.key==='Enter') sendAIMessage(); });

const dayTabs = document.getElementById('dayTabs');
const entryList = document.getElementById('entryList');

function attendeeLabel(attendees){
  if(attendees.length === activeMembers.length) return { text:'Everyone', cls:'attendee-everyone' };
  if(attendees.length <= 2) return { text: attendees.join(', '), cls:'attendee-some' };
  return { text: attendees.slice(0,2).join(', ') + ' +' + (attendees.length-2), cls:'attendee-some' };
}

function renderDayTabs(){
  dayTabs.innerHTML = days.map((d,i)=>
    '<button class="day-chip '+(i===activeDay?'active':'')+'" data-day="'+i+'">'+d.label+'</button>'
  ).join('') + '<button class="add-day-chip" id="addDayBtn">+ Day</button>';
  dayTabs.querySelectorAll('.day-chip').forEach(el=>{
    el.addEventListener('click', ()=>{ activeDay = +el.dataset.day; renderDayTabs(); renderEntries(); });
  });
  document.getElementById('addDayBtn').addEventListener('click', ()=>{
    days.push({ label:'Day '+(days.length+1), entries:[] });
    activeDay = days.length-1;
    renderDayTabs(); renderEntries();
  });
}

function renderEntries(){
  const day = days[activeDay];
  const sorted = day.entries.map((e,i)=>({...e, idx:i})).sort((a,b)=> a.time.localeCompare(b.time));
  if(sorted.length === 0){
    entryList.innerHTML = '<p style="font-size:11.5px;color:var(--ink-muted);text-align:center;padding:16px 0;">Nothing planned for '+day.label+' yet</p>';
    return;
  }
  entryList.innerHTML = sorted.map(e=>{
    const tag = attendeeLabel(e.attendees);
    return '<div class="entry-row">'+
      '<div class="entry-time">'+e.time+'</div>'+
      '<div class="entry-card'+(e._adhoc?' adhoc':'')+'">'+
        '<div><div class="entry-name">'+e.name+'</div><div class="entry-meta">'+
        (isSolo ? '' : '<span class="attendee-tag '+tag.cls+'">'+tag.text+'</span>')+
        (e._adhoc?'<span class="entry-source">from Brainstorming</span>':'')+
        '</div></div>'+
        '<div class="entry-actions" data-edit="'+e.idx+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></div>'+
      '</div>'+
    '</div>';
  }).join('');
  entryList.querySelectorAll('[data-edit]').forEach(el=>{
    el.addEventListener('click', ()=> openEntryModal(activeDay, +el.dataset.edit));
  });
}

function populateDaySelect(selectedIdx){
  const sel = document.getElementById('entryDay');
  sel.innerHTML = days.map((d,i)=> '<option value="'+i+'" '+(i===selectedIdx?'selected':'')+'>'+d.label+'</option>').join('');
}

let pendingShortlistIdx = null;

function openEntryModal(dayIdx, entryIdx, prefillName, shortlistIdx){
  editingEntry = entryIdx === null ? null : { dayIdx, entryIdx };
  pendingShortlistIdx = shortlistIdx !== undefined ? shortlistIdx : null;
  const entry = entryIdx === null ? null : days[dayIdx].entries[entryIdx];

  document.getElementById('entryModalTitle').textContent = entry ? 'Edit entry' : (prefillName ? 'Add "'+prefillName+'" to a day' : 'Add to '+days[dayIdx].label);
  document.getElementById('entryName').value = entry ? entry.name : (prefillName || '');
  document.getElementById('entryTime').value = entry ? entry.time : '';
  document.getElementById('entryDelete').style.display = entry ? 'block' : 'none';
  populateDaySelect(dayIdx);

  const picker = document.getElementById('attendeePicker');
  const pickerLabel = picker.previousElementSibling;
  if(isSolo){
    if(pickerLabel) pickerLabel.style.display = 'none';
    picker.style.display = 'none';
  } else {
    const selected = entry ? entry.attendees : [...groupMembers];
    picker.innerHTML = groupMembers.map(m=>
      '<button type="button" class="attendee-chip '+(selected.includes(m)?'selected':'')+'" data-member="'+m+'">'+m+'</button>'
    ).join('');
    picker.querySelectorAll('.attendee-chip').forEach(chip=>{
      chip.addEventListener('click', ()=> chip.classList.toggle('selected'));
    });
  }

  openModal('entryModal');
}

document.getElementById('addEntryBtn').addEventListener('click', ()=> openEntryModal(activeDay, null));

document.getElementById('entrySave').addEventListener('click', ()=>{
  const name = document.getElementById('entryName').value.trim();
  const time = document.getElementById('entryTime').value || '00:00';
  const dayIdx = +document.getElementById('entryDay').value;
  const attendees = isSolo ? ['You'] : [...document.querySelectorAll('.attendee-chip.selected')].map(c=> c.dataset.member);
  if(!name || attendees.length === 0) return;

  if(editingEntry){
    days[editingEntry.dayIdx].entries.splice(editingEntry.entryIdx, 1);
    days[dayIdx].entries.push({ time, name, attendees });
  } else {
    days[dayIdx].entries.push({ time, name, attendees });
  }
  if(pendingShortlistIdx !== null){
    shortlist[pendingShortlistIdx].placed = true;
    renderShortlist();
  }
  closeModal('entryModal');
  activeDay = dayIdx;
  renderDayTabs(); renderEntries();
});

document.getElementById('entryDelete').addEventListener('click', ()=>{
  if(!editingEntry) return;
  days[editingEntry.dayIdx].entries.splice(editingEntry.entryIdx, 1);
  closeModal('entryModal');
  renderEntries();
});

function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){
  document.getElementById(id).classList.remove('open');
  if(id === 'pollModal') resetPollForm();
}
document.querySelectorAll('[data-close]').forEach(b=> b.addEventListener('click', ()=> closeModal(b.dataset.close)));

document.getElementById('sendBtn').addEventListener('click', sendText);
document.getElementById('msgInput').addEventListener('keydown', e=>{ if(e.key==='Enter') sendText(); });
function sendText(){
  const input = document.getElementById('msgInput');
  const val = input.value.trim();
  if(!val) return;
  const isLink = /^(https?:\/\/|www\.)\S+$/i.test(val);
  const newMsg = isLink
    ? { type:'link', sender:'You', url:val, title:null }
    : { type:'text', sender:'You', text:val };
  if(replyingTo){ newMsg.replyTo = replyingTo; replyingTo = null; showReplyPreview(); }
  messages.push(newMsg);
  input.value = '';
  renderChat();
}

const MAX_POLL_OPTIONS = 6;
document.getElementById('addPollOption').addEventListener('click', ()=>{
  const container = document.getElementById('pollOptionsContainer');
  const count = container.querySelectorAll('.poll-option-input').length;
  if(count >= MAX_POLL_OPTIONS) return;
  const input = document.createElement('input');
  input.type = 'text'; input.className = 'poll-option-input'; input.placeholder = 'Option '+(count+1);
  container.appendChild(input);
  if(count+1 >= MAX_POLL_OPTIONS) document.getElementById('addPollOption').style.display = 'none';
});
function resetPollForm(){
  document.getElementById('pollQ').value = '';
  document.getElementById('pollOptionsContainer').innerHTML = '<input type="text" class="poll-option-input" placeholder="Option 1"><input type="text" class="poll-option-input" placeholder="Option 2">';
  document.getElementById('addPollOption').style.display = 'block';
}
document.getElementById('pollBtn').addEventListener('click', ()=> openModal('pollModal'));
document.getElementById('pollSave').addEventListener('click', ()=>{
  const q = document.getElementById('pollQ').value.trim();
  const optionValues = [...document.querySelectorAll('.poll-option-input')].map(el=>el.value.trim()).filter(v=>v);
  if(!q || optionValues.length < 2) return;
  messages.push({ type:'poll', sender:'You', question:q, options:optionValues.map(label=>({label,votes:0})), addedToShortlist:false });
  resetPollForm(); closeModal('pollModal'); renderChat();
});

document.getElementById('linkBtn').addEventListener('click', ()=> openModal('linkModal'));
document.getElementById('linkSave').addEventListener('click', ()=>{
  const url = document.getElementById('linkUrl').value.trim();
  if(!url) return;
  messages.push({ type:'link', sender:'You', url, title:null, addedToShortlist:false });
  document.getElementById('linkUrl').value = '';
  closeModal('linkModal'); renderChat();
});

document.getElementById('ideaBtn').addEventListener('click', ()=> openModal('ideaModal'));
document.getElementById('ideaSave').addEventListener('click', ()=>{
  const text = document.getElementById('ideaText').value.trim();
  const day = document.getElementById('ideaDay').value.trim();
  const time = document.getElementById('ideaTime').value;
  if(!text || !day || !time) return;
  messages.push({ type:'adhoc', sender:'You', text, day, time, optIns:['You'], formed:false, youJoined:true });
  document.getElementById('ideaText').value = '';
  document.getElementById('ideaDay').value = '';
  document.getElementById('ideaTime').value = '';
  closeModal('ideaModal'); renderChat();
});

renderChat();
renderShortlist();
renderDayTabs();
renderEntries();
applySoloMode();

// Deep-link support so the app shell can open this straight to any of the
// three internal views — e.g. trip.html?view=plan
const urlParams = new URLSearchParams(window.location.search);
if(urlParams.get('view') === 'plan') showView('plan');
if(urlParams.get('view') === 'ai-chat') showView('ai-chat');

// The shell (index.html) points Brainstorming, AI Chat, and The Plan all at
// this SAME loaded instance (not three separate copies) so the shortlist
// stays shared across all of them — this listener is how it tells us which
// internal view to show.
window.addEventListener('message', e=>{
  if(e.data === 'showBrainstorm') showView('brainstorm');
  if(e.data === 'showPlan') showView('plan');
  if(e.data === 'showAIChat') showView('ai-chat');
});

</script>
